<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Tracker</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <h2>🐛 Bug Tracker Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
        <div id="loginError" style="color: red; margin-top: 10px; text-align: center;"></div>
       
    </div>

    <!-- Main Application -->
    <div id="mainApp" class="container hidden">
        <div class="header">
            <h1>🐛 Bug Tracker</h1>
            <div class="user-info">
                <span class="user-badge" id="userDisplay"></span>
                <button class="btn btn-secondary" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="openBugModal()" id="addBugBtn">+ Add Bug</button>
            <div class="filter-group">
                <input type="text" id="searchInput" placeholder="Search..." onkeyup="applyFilters()">
                <select id="severityFilter" onchange="applyFilters()">
                    <option value="">All Severities</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                    <option value="Critical">Critical</option>
                </select>
                <select id="statusFilter" onchange="applyFilters()">
                    <option value="">All Statuses</option>
                    <option value="Open">Open</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                    <option value="Closed">Closed</option>
                </select>
            </div>
        </div>

        <table id="bugsTable">
            <thead>
                <tr>
                    <th onclick="sortTable('id')">ID ↕</th>
                    <th onclick="sortTable('title')">Title/Description ↕</th>
                    <th onclick="sortTable('module')">Module ↕</th>
                    <th>Web Page</th>
                    <th onclick="sortTable('severity')">Severity ↕</th>
                    <th onclick="sortTable('status')">Status ↕</th>
                    <th onclick="sortTable('dateReported')">Date Reported ↕</th>
                    <th>Date Resolved</th>
                    <th>Assigned To</th>
                    <th onclick="sortTable('eta')">ETA (hrs) ↕</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="bugsTableBody">
                <tr><td colspan="11" class="loading">Loading bugs...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Bug Modal -->
    <div id="bugModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Bug</h2>
                <span class="close-btn" onclick="closeBugModal()">&times;</span>
            </div>
            <form id="bugForm">
                <input type="hidden" id="bugId">

                <div class="form-row">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="bugTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Module *</label>
                        <input type="text" id="bugModule" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Description *</label>
                    <textarea id="bugDescription" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Web Page</label>
                        <input type="text" id="bugWebPage">
                    </div>
                    <div class="form-group">
                        <label>Severity *</label>
                        <select id="bugSeverity" required>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Status *</label>
                        <select id="bugStatus" required>
                            <option value="Open">Open</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Resolved">Resolved</option>
                            <option value="Closed">Closed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Assigned To</label>
                        <input type="text" id="bugAssignedTo">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Date Reported *</label>
                        <input type="date" id="bugDateReported" required>
                    </div>
                    <div class="form-group">
                        <label>Date Resolved</label>
                        <input type="date" id="bugDateResolved">
                    </div>
                </div>

                <div class="form-group">
                    <label>ETA (hours)</label>
                    <input type="number" id="bugETA" value="0" min="0">
                </div>

                <div class="form-group">
                    <label>Screenshots</label>
                    <input type="file" id="bugScreenshots" multiple accept="image/*">
                    <div id="existingScreenshots" class="screenshots-container"></div>
                </div>

                <div class="comments-section" id="commentsSection" style="display: none;">
                    <h3>Dev Comments</h3>
                    <div id="commentsList"></div>
                    <div class="form-group" id="addComments">
                        <textarea id="newComment" placeholder="Add a comment..."></textarea>
                        <button type="button" class="btn btn-secondary" onclick="addComment()" style="margin-top: 10px;">Add Comment</button>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-success">Save Bug</button>
                    <button type="button" class="btn btn-secondary" onclick="closeBugModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Image Preview Modal -->
    <div id="imagePreviewModal" class="image-preview-modal" onclick="closeImagePreview()">
        <img id="previewImage" src="" alt="Preview">
    </div>

    <script src="js/scripts.js" ></script>
</body>
</html>
